[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wheneval"
version = "3.1.0"
description = "Pooled and within-patient evaluation quantities for repeated binary forecasts"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["numpy", "pandas", "statsmodels"]

[tool.setuptools.packages.find]
where = ["src"]
